name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q "*.zip" && cp GeminiClient.kt YESMIN/app/src/main/java/com/yesmin/app/ai/GeminiClient.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: YESMIN
      - uses: actions/upload-artifact@v4
        with:
          name: yesmin-apk
          path: YESMIN/app/build/outputs/apk/debug/app-debug.apk
